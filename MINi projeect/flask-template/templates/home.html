
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Enquiry Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">🎓</div>
            <div>
                <h1>College Assistant</h1>
                <p>Your college enquiry chatbot</p>
            </div>
            <a href="/about" class="about-link">About</a>
        </header>

        <section id="chat" class="chat">
            <div class="message bot">
                Hello! 👋 Welcome to College Assistant.
                Ask me about courses, admissions, fees, scholarships or exams.
            </div>
        </section>

        <div class="quick-questions">
            <button onclick="askQuestion('courses')">Courses</button>
            <button onclick="askQuestion('admission')">Admissions</button>
            <button onclick="askQuestion('fees')">Fees</button>
            <button onclick="askQuestion('scholarship')">Scholarships</button>
            <button onclick="askQuestion('placement')">Placements</button>
        </div>

        <div class="actions">
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
            <button class="history-btn" onclick="showHistory()">Chat History</button>
        </div>

        <form id="chat-form" class="input-area">
            <input id="message" type="text" placeholder="Ask your question..." autocomplete="off">
            <button type="submit">Send ➤</button>
        </form>

        <footer>College Enquiry Chatbot · Python & Flask</footer>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
